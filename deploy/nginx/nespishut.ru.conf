# nginx → Next.js (порт 3000). Next.js сам проксирует /api/* в NestJS (порт 4000).
# HTTPS (блок listen 443) добавит certbot: certbot --nginx -d nespishut.ru -d www.nespishut.ru
server {
    listen 80;
    server_name nespishut.ru www.nespishut.ru;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
